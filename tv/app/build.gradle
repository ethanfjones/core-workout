plugins {
    id 'com.android.application'
}

// The web app (../../index.html) and its voice clips are bundled as assets,
// so the TV still works when the site is unreachable.
def webDir = layout.buildDirectory.dir('generated/web')
def copyWeb = tasks.register('copyWeb', Copy) {
    from rootProject.file('../index.html')
    from(rootProject.file('../audio')) {
        include '*.mp3'
        into 'audio'
    }
    into webDir
}

android {
    namespace 'io.github.ethanfjones.coreworkout'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ethanfjones.coreworkout'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    sourceSets {
        main.assets.srcDirs += webDir
    }

    buildTypes {
        release {
            // Not minified: the WebView's JavaScript bridge methods must keep their names.
            minifyEnabled false
            // Sideloaded over ADB like the CleanYourTV add-ons: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyWeb }
