<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116">
<title>Runner Training</title>
<style>
:root{
  --bg:#0e1116;--card:#171c24;--card2:#1e2530;--text:#eef1f5;--muted:#9aa4b2;--line:#2a3342;
  --work:#3ddc97;--rest:#4ea8ff;--ready:#ffb454;--danger:#ff6b6b;--accent:#3ddc97;--on-accent:#06251a;
  --fig:#e8edf3;--fig-far:#5f6b7a;--move:#3ddc97;--mat:#2a3342;
  --c-ext:#ff8a65;--c-rot:#b794f6;--c-lat:#4dd0e1;--c-hip:#f6c85f;--c-fin:#ff6b9d;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f9;--card:#ffffff;--card2:#eef1f6;--text:#12161c;--muted:#5b6574;--line:#dde3ec;
    --work:#0f9d65;--rest:#1f78d1;--ready:#c77f00;--danger:#d63b3b;--accent:#0f9d65;--on-accent:#ffffff;
    --fig:#1b222c;--fig-far:#a3adbb;--move:#0f9d65;--mat:#dde3ec;
    --c-ext:#d4552b;--c-rot:#7a4fd1;--c-lat:#0b8da0;--c-hip:#a8780a;--c-fin:#cc3a73;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px}

/* ---------- setup ---------- */
#setup{padding:max(16px,env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px}
.opt>span{color:var(--muted);font-size:.8rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:8px 4px;border-radius:10px;font-weight:600;color:var(--muted);min-height:44px;line-height:1.15}
.seg button small{display:block;font-weight:500;font-size:.72rem;opacity:.85}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.summary{display:flex;justify-content:space-between;gap:8px;margin:16px 2px 10px;color:var(--muted);font-size:.88rem}
.summary b{color:var(--text)}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item svg{width:104px;height:56px;background:var(--card2);border-radius:8px}
.item .n{font-weight:650;line-height:1.2}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0;font-size:.8rem;color:var(--muted)}
.item .cue{font-size:.84rem;color:var(--muted);line-height:1.3}
.chip{font-size:.7rem;font-weight:650;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.cat-ext{color:var(--c-ext)}.cat-rot{color:var(--c-rot)}.cat-lat{color:var(--c-lat)}.cat-hip{color:var(--c-hip)}.cat-fin{color:var(--c-fin)}
.cat-wmob,.cat-calf{color:var(--c-lat)}.cat-wswing,.cat-hipflex{color:var(--c-ext)}.cat-wlunge,.cat-ham{color:var(--c-rot)}
.cat-wdrill,.cat-glute{color:var(--c-fin)}.cat-add{color:var(--c-hip)}.cat-back{color:var(--muted)}

/* ---------- home ---------- */
#home{padding:max(16px,env(safe-area-inset-top)) 0 32px}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.card{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:96px}
.card svg{width:120px;height:64px;background:var(--card2);border-radius:10px}
.card b{display:block;font-size:1.15rem;margin-bottom:2px}
.card span{color:var(--muted);font-size:.88rem;line-height:1.3}
.plan-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.plan-head button{min-height:44px;padding:8px 12px 8px 4px;color:var(--muted);font-weight:600}
.dur{color:var(--text);font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{min-height:54px;border-radius:14px;font-weight:700;font-size:1.05rem;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:18px}
.foot button{text-decoration:underline;color:var(--muted);padding:6px}

/* ---------- run ---------- */
#run{display:flex;flex-direction:column;height:100dvh;padding:max(10px,env(safe-area-inset-top)) 0 max(10px,env(safe-area-inset-bottom));gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.top small{display:block;color:var(--muted);font-size:.68rem;font-weight:650;letter-spacing:.08em}
.top b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.top .r{text-align:right}
.top .r span{display:block;color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i.done{background:var(--work)}
.prog i.now::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--phase,var(--work))}
.phase{align-self:center;font-weight:800;letter-spacing:.12em;font-size:.9rem;padding:4px 14px;border-radius:99px;background:var(--phase,var(--work));color:#04140d}
body[data-phase=rest]{--phase:var(--rest)}
body[data-phase=ready]{--phase:var(--ready)}
body[data-phase=work]{--phase:var(--work)}
body[data-paused=true]{--phase:var(--muted)}
body[data-phase=rest] .phase,body[data-phase=ready] .phase{color:#06111c}
.figwrap{flex:1 1 0;min-height:90px;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--phase,var(--line));border-radius:18px;padding:6px;transition:border-color .2s}
.figwrap svg{width:100%;height:100%;max-height:260px}
.nm{margin:0;text-align:center;font-size:1.35rem;line-height:1.15;letter-spacing:-.01em}
.q{margin:0;text-align:center;color:var(--muted);font-size:.95rem;min-height:2.6em}
.side{align-self:center;min-height:26px;font-weight:700;font-size:.85rem;color:var(--ready)}
.side.flash{animation:flash .6s 2}
@keyframes flash{50%{opacity:.2}}
.timer{text-align:center}
#setTime{font-size:min(26vw,7.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--phase,var(--text))}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;width:0;background:var(--phase,var(--work))}
.next{text-align:center;color:var(--muted);font-size:.85rem;min-height:1.3em}
.next b{color:var(--text)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctrl .btn{min-height:58px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tog button{padding:10px 12px;min-height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.tog button[aria-pressed=true]{color:var(--text);border-color:var(--accent)}
.tog .stop{color:var(--danger)}
body[data-paused=true] #setTime{opacity:.45}

/* ---------- done ---------- */
#done{padding:calc(max(16px,env(safe-area-inset-top)) + 40px) 0;text-align:center}
#done .big{font-size:4rem;margin:0}
#done p{color:var(--muted)}
#done .btn{width:100%;margin-top:12px}

/* ---------- remote control focus ---------- */
:focus{outline:none}
:focus-visible{outline:3px solid var(--ready);outline-offset:3px}

/* ---------- wide screens (TV, phone on its side): diagram left, timer right ---------- */
@media (orientation: landscape) and (min-width: 700px){
  .app{max-width:1200px}
  .opts{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:12px}
  .opt{grid-template-columns:1fr}
  .list{display:grid;grid-template-columns:1fr 1fr}
  .cards{display:grid;grid-template-columns:repeat(3,1fr)}
  .card{grid-template-columns:1fr;text-align:center}
  .card svg{width:100%;height:auto;aspect-ratio:240/128}
  #run{display:grid;grid-template-columns:1.25fr 1fr;column-gap:24px;row-gap:6px;
    grid-template-areas:"top top" "prog prog" "fig phase" "fig nm" "fig q" "fig side" "fig timer" "fig next" "fig ctrl" "fig tog";
    grid-template-rows:auto auto 1fr auto auto auto auto auto auto 1fr}
  .top{grid-area:top}.prog{grid-area:prog}.figwrap{grid-area:fig}.nm{grid-area:nm}
  .q{grid-area:q;min-height:0}.timer{grid-area:timer}.next{grid-area:next}.ctrl{grid-area:ctrl}
  .phase{grid-area:phase;align-self:end;justify-self:center}
  .side{grid-area:side;justify-self:center}
  .tog{grid-area:tog;align-self:start}
  .figwrap svg{max-height:none}
  #setTime{font-size:min(14vw,9rem)}
}

/* ---------- diagrams ---------- */
svg line{stroke-linecap:round}
svg .fg{stroke:var(--fig)}svg .bk{stroke:var(--fig-far)}
svg .mv{stroke:var(--move)}svg .mvf{stroke:var(--move);opacity:.5}
svg .head{fill:var(--fig)}svg .eye{fill:var(--card)}
svg .mat{fill:var(--mat)}
svg .prop{stroke:var(--fig-far);stroke-linecap:round;opacity:.7}svg .propf{fill:var(--fig-far);opacity:.35}
svg .arrow{fill:none;stroke:var(--move);stroke-width:2.5;stroke-dasharray:5 4;opacity:.9}
svg .ahd{fill:var(--move)}
svg .badge rect{fill:none;stroke:var(--move);stroke-width:1.5}
svg .badge text{fill:var(--move);font:700 10px system-ui,sans-serif;letter-spacing:.08em}
</style>
</head>
<body data-phase="ready">
<!-- shared arrowhead, kept outside display:none screens so every diagram can reference it -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="ahd" d="M0,0L10,5L0,10z"/></marker>
</defs></svg>
<div class="app">

<!-- ======== SETUP ======== -->
<!-- ======== HOME ======== -->
<main id="home">
  <h1>Runner training</h1>
  <p class="sub">Pick a session. Bodyweight only.</p>
  <div class="cards" id="cards">
    <button class="card" data-kind="warmup"><svg viewBox="0 -8 240 128" aria-hidden="true" data-icon="wgs"></svg><div><b>Pre-run warm-up</b><span>5 min · dynamic mobility and running drills</span></div></button>
    <button class="card" data-kind="core"><svg viewBox="0 -8 240 128" aria-hidden="true" data-icon="deadbug"></svg><div><b>Core workout</b><span>Anti-movement strength · 5, 10 or 15 min</span></div></button>
    <button class="card" data-kind="cooldown"><svg viewBox="0 -8 240 128" aria-hidden="true" data-icon="couch"></svg><div><b>Post-run stretch</b><span>7 min · static holds for calves, hips and hamstrings</span></div></button>
  </div>
  <div class="foot" id="foot"></div>
</main>

<!-- ======== PLAN ======== -->
<main id="setup" hidden>
  <div class="plan-head"><button id="homeBtn">‹ Home</button></div>
  <h1 id="planTitle">Core workout</h1>
  <p class="sub" id="planSub"></p>
  <div class="opts">
    <div class="opt" data-core><span>Difficulty</span>
      <div class="seg" id="levels" role="group" aria-label="Difficulty">
        <button data-v="easy">Easy<small>2:1 work : rest</small></button>
        <button data-v="moderate">Moderate<small>3:1 work : rest</small></button>
        <button data-v="hard">Hard<small>4:1 work : rest</small></button>
      </div></div>
    <div class="opt" data-core><span>Length</span>
      <div class="seg" id="lens" role="group" aria-label="Length">
        <button data-v="5">5 min</button><button data-v="10">10 min</button><button data-v="15">15 min</button>
      </div></div>
    <div class="opt"><span>Voice</span>
      <div class="seg" id="voices" role="group" aria-label="Voice" style="--n:4">
        <button data-v="0">Off</button><button data-v="0.85">Slow</button><button data-v="1">Normal</button><button data-v="1.15">Fast</button>
      </div></div>
  </div>
  <div class="summary" id="summary"></div>
  <ol class="list" id="list"></ol>
</main>
<div class="dock" id="dock" hidden><div class="in">
  <button class="btn" id="regen">↻ Regenerate</button>
  <button class="btn primary" id="start">Start workout</button>
</div></div>

<!-- ======== RUN ======== -->
<main id="run" hidden>
  <div class="top">
    <div><small>SET</small><b id="setNo">1 / 10</b></div>
    <div class="r"><small>WORKOUT LEFT</small><b id="totLeft">10:00</b><span id="totEl">0:00 elapsed</span></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="phase" id="phase">GET READY</div>
  <div class="figwrap"><svg id="fig" viewBox="0 -8 240 128" role="img" aria-label="Exercise diagram"></svg></div>
  <h2 class="nm" id="rName"></h2>
  <p class="q" id="rCue"></p>
  <div class="side" id="rSide"></div>
  <div class="timer"><div id="setTime">0:10</div><div class="tbar"><i id="tbarFill"></i></div></div>
  <div class="next" id="rNext"></div>
  <div class="ctrl">
    <button class="btn" id="bBack" aria-label="Previous">⏮ Back</button>
    <button class="btn primary" id="bPause">Pause</button>
    <button class="btn" id="bSkip" aria-label="Skip">Skip ⏭</button>
  </div>
  <div class="tog">
    <button id="tSound" aria-pressed="true">🔔 Sound</button>
    <button id="tVoice" aria-pressed="true">🗣 Voice</button>
    <button id="bStop" class="stop">End</button>
  </div>
</main>

<!-- ======== DONE ======== -->
<main id="done" hidden>
  <p class="big">✓</p>
  <h1>Done. Nice work.</h1>
  <p id="doneTxt"></p>
  <button class="btn primary" id="again">Back to home</button>
</main>

</div>
<script>
'use strict';
/*LOGIC_START*/
// ---------- storage (falls back to memory if localStorage is blocked) ----------
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
};
const HIST_KEY = 'runnerCore.history.v1';
const loadHistory = () => { try { const h = JSON.parse(store.get(HIST_KEY)||'[]'); return Array.isArray(h)?h:[]; } catch(e){ return []; } };
const saveHistory = h => store.set(HIST_KEY, JSON.stringify(h.slice(0,30)));

// ---------- pose library (side-on figures, head left, viewBox 0 -8 240 128, mat top y=110) ----------
// pose = {h:head, s:shoulder, p:hip, a:[elbow,hand] near arm, a2: far arm, l:[knee,foot] near leg, l2: far leg,
//         f: direction the face points, in degrees (omitted when the figure faces the viewer),
//         m: optional mid-back point for a curved spine, z: zoom about the mat centre (standing figures),
//         wall: x of a wall, chair: [x, seat y, width], couch: true}
const P = (b,a,a2,l,l2) => ({...b,a,a2,l,l2});
const shift = (q,dx,dy) => { const T=v=>[v[0]+dx,v[1]+dy]; return {...q,h:T(q.h),s:T(q.s),p:T(q.p),a:q.a.map(T),a2:q.a2.map(T),l:q.l.map(T),l2:q.l2.map(T)}; };
const rot = (q,deg,c) => {
  const t=deg*Math.PI/180, R=v=>[c[0]+(v[0]-c[0])*Math.cos(t)-(v[1]-c[1])*Math.sin(t), c[1]+(v[0]-c[0])*Math.sin(t)+(v[1]-c[1])*Math.cos(t)];
  return {h:R(q.h),s:R(q.s),p:R(q.p),f:q.f+deg,a:q.a.map(R),a2:q.a2.map(R),l:q.l.map(R),l2:q.l2.map(R)};
};
// lying on the back
const SUP={h:[40,100],s:[62,102],p:[130,102],f:-90};
const ARM_UP=[[62,74],[62,48]], ARM_OVER=[[38,86],[14,72]], ARM_SIDE=[[88,103],[114,103]];
const LEG_TAB=[[130,66],[164,66]], LEG_EXT=[[165,98],[199,95]], LEG_TAP=[[155,72],[181,100]], LEG_VERT=[[132,66],[134,32]];
const HO={h:[52,80],s:[68,84],p:[130,102],f:-70}, HO_ARM=[[42,70],[16,58]], HO_LEG=[[165,93],[199,84]];
// hands and knees
const QUAD={h:[52,64],s:[70,72],p:[140,72],f:140};
const Q_ARMD=[[70,89],[70,106]], Q_ARMR=[[44,70],[18,70]];
const Q_LEGD=[[140,106],[172,106]], Q_LEGB=[[172,72],[206,74]], Q_HYD=[[170,62],[176,94]];
// high plank on hands
const HP={h:[44,60],s:[60,66],p:[130,85],f:120};
const H_ARM=[[60,86],[60,106]], H_TAP=[[84,80],[64,70]], H_REACH=[[34,64],[8,62]];
const H_LEG=[[165,95],[200,104]], H_LIFT=[[166,82],[202,78]], H_DRIVE=[[98,80],[122,104]], H_SPIDER=[[96,72],[122,90]];
const H_WIDE=[[160,96],[190,105]], H_WIDE2=[[172,96],[214,105]];
// bear: knees hovering under hips
const BEAR={h:[46,64],s:[64,72],p:[140,68],f:130};
const B_ARM=[[64,90],[64,106]], B_TAP=[[88,80],[68,70]], B_REACH=[[40,70],[16,68]], B_LEG=[[148,100],[184,104]];
// forearm planks
const FP={h:[44,72],s:[60,76],p:[130,90],f:120}, F_ARM=[[60,104],[34,104]], F_LEG=[[165,97],[200,104]];
const LL={h:[56,72],s:[72,76],p:[136,90],f:120}, LL_ARM=[[46,102],[24,104]], LL_LEG=[[168,97],[200,104]];
const saw = dx => P({h:[44+dx*.3,72],s:[60+dx*.3,76],p:[130+dx*.7,90],f:120},F_ARM,F_ARM,[[165+dx*.85,97],[200+dx,104]],[[165+dx*.85,97],[200+dx,104]]);
const circ = (dx,dy) => P({h:[44+dx,72+dy],s:[60+dx,76+dy],p:[130+dx*.4,90+dy*.4],f:120},F_ARM,F_ARM,F_LEG,F_LEG);
// side planks, seen from the front
const SPB={h:[54,68],s:[70,78],p:[130,92]}, SP_SUP=[[70,104],[82,106]], SP_UP=[[70,52],[70,26]];
const SP_LEG=[[166,98],[200,104]], SP_LIFT=[[165,80],[198,66]], SP_DRIVE=[[118,66],[146,82]];
const SPK={h:[54,68],s:[70,78],p:[122,90]}, SPK_LEG=[[156,104],[190,105]];
const SPH={h:[54,58],s:[70,66],p:[132,86]}, SPH_SUP=[[70,86],[70,106]], SPH_UP=[[70,40],[70,14]], SPH_LEG=[[166,95],[200,104]];
const SPH_STAR=[[164,66],[196,48]];
// bridges
const BRB={h:[46,100],s:[66,100],p:[122,78],f:-90}, BRL={h:[46,100],s:[66,100],p:[124,94],f:-90};
const BR_PL=[[158,66],[146,102]], BR_PLL=[[160,76],[146,102]], BR_UP=[[142,52],[176,52]];
const BR_EXT=[[158,62],[194,48]], BR_EXTL=[[160,80],[196,66]];
// lying on the side, seen from the front: head propped on the bottom hand
const SL={h:[40,88],s:[64,98],p:[130,98]}, SL_PROP=[[46,106],[36,96]], SL_REST=[[88,92],[110,98]];
const SL_BOT=[[165,101],[200,102]], SL_TOP=[[165,97],[200,98]], SL_ABD=[[163,80],[196,62]];
const SL_DBL=[[164,87],[198,79]], SL_DBL2=[[164,91],[198,83]];
const CL_BOT=[[156,103],[188,104]], CL_TOP=[[156,94],[188,100]], CL_OPEN=[[150,66],[188,99]];
// reverse plank (face up, hands under shoulders) and single-leg hinges
const REV={h:[46,56],s:[64,64],p:[132,82],f:-110}, REV_ARM=[[60,85],[56,106]], REV_LEG=[[166,94],[200,104]];
const HINGE={h:[46,34],s:[64,38],p:[124,38],f:115};
const HG_HANG=[[64,60],[64,84]], HG_UP=[[66,16],[68,-4]], HG_STAND=[[126,72],[126,106]];
const HG_BACK=[[160,40],[194,42]], HG_OPEN=[[152,20],[176,40]];
// standing figures are drawn full size and zoomed out (z); STF faces the viewer
const ST={h:[120,-42],s:[120,-24],p:[120,36],f:180,z:.72}, STF={h:[120,-42],s:[120,-24],p:[120,36],z:.72};

const ALL = EX.concat(STRETCH);
const byId = Object.fromEntries(ALL.map(e=>[e.id,e]));

// Each routine picks one exercise per slot (no repeats), then fits durations to the target length
const ROUTINES = {
  warmup:  {title:'Pre-run warm-up', target:300, trans:5,
            sub:'Dynamic mobility and running drills. About 5 minutes, done just before you head out.',
            slots:[['catcow','inchworm'],['ankle'],['wgs'],['swingfb'],['swingside'],['revlunge','latlunge','hipcircle'],['revlunge','latlunge','hipcircle'],['askip'],['pogo']]},
  cooldown:{title:'Post-run stretch', target:420, trans:10,
            sub:'Static holds after your run: about 30 seconds per side, adding up to a minute per muscle group.',
            slots:[['calfstraight'],['calfbent'],['quad','couch','hipflexor'],['hamchair','hamsupine'],['fig4','pigeon','ninety'],['butterfly','straddle'],['child','twist']]},
};
function buildRoutine(kind, hist){
  const R0 = ROUTINES[kind], recency = e => { const i=hist.findIndex(h=>h.ids.includes(e.id)); return i<0?1:i===0?.25:.6; };
  const chosen = [];
  for(const slot of R0.slots){
    const pool = slot.map(id=>byId[id]).filter(e=>!chosen.includes(e));
    chosen.push(...pickN(pool,1,recency));
  }
  const exs = kind==='cooldown' ? chosen.slice().sort((a,b)=>a.ord-b.ord) : chosen;
  const step = e => e.uni ? 10 : 5, budget = R0.target - R0.trans*(exs.length-1);
  const base = exs.reduce((t,e)=>t+e.dur,0);
  const ws = exs.map(e=>Math.max(e.uni?20:15, Math.round(e.dur*budget/base/step(e))*step(e)));
  for(let k=0;k<60;k++){
    const t = ws.reduce((a,b)=>a+b,0) + R0.trans*(exs.length-1);
    if(Math.abs(t-R0.target)<=5) break;
    const i = Math.floor(Math.random()*exs.length), d = step(exs[i]);
    if(t<R0.target) ws[i]+=d; else if(ws[i]-d >= (exs[i].uni?20:15)) ws[i]-=d;
  }
  const blocks = exs.map((ex,i)=>({ex, work:ws[i], rest:i<exs.length-1?R0.trans:0}));
  return {kind, blocks, total:blocks.reduce((t,b)=>t+b.work+b.rest,0)};
}

// ---------- spoken lines (recorded once as audio/<key>.mp3 by tools/voice) ----------
const spokenName = ex => ex.say || ex.name.replace(/\s*\(.*?\)/g,'').replace(/ \+ /,' with ').replace(/&/,'and');
const spokenCue = ex => ex.cue.replace(/°/g,' degrees');
const PHRASES = {
  'p-get-ready':'Get ready.', 'p-rest':'Rest.', 'p-last':'Last one.', 'p-halfway':'Halfway.', 'p-ten':'Ten seconds.',
  'p-3':'Three.', 'p-2':'Two.', 'p-1':'One.', 'p-switch':'Switch sides.',
  'p-done-core':'Workout complete. Nice work.', 'p-done-warmup':'Warm-up done. Have a good run.',
  'p-done-cooldown':'All done. Nice work today.', 'p-sample':'Right then. This is your coach. Let us get to work.',
};
function voiceLines(){

  for(let n=5;n<=40;n++) L['d-'+n+'-each']=`${n} seconds each side.`;

// ---------- levels and lengths ----------
const RATIO = {easy:2, moderate:3, hard:4};                       // work : rest
const SHORT = {easy:[25,30,35,40,45], moderate:[30,35,40,45], hard:[35,40,45,50]};
const LONGS = {easy:[60], moderate:[60], hard:[60,75]};
const LEVEL_LABEL = {easy:'Easy', moderate:'Moderate', hard:'Hard'};
const LENGTHS = {5:{per:1,wild:0,nl:[1]}, 10:{per:2,wild:1,nl:[2,3]}, 15:{per:3,wild:1,nl:[3,4]}};
const CAT_ORDER = ['hip','ext','rot','lat','fin'];                // hip activation first, finisher last

const inLevel = (e,l) => l==='easy' ? (e.lv.includes('E')||e.lv.includes('M'))
  : l==='moderate' ? (e.lv.includes('M')||e.lv.includes('H'))
  : (e.lv.includes('H')||e.lv.includes('A'));
const nearLevel = (e,l) => l==='easy' ? e.lv.includes('H') : l==='moderate' ? e.lv.includes('E') : e.lv.includes('M');
const levelWeight = (e,l) => (l==='moderate' && e.lv.includes('H')) || (l==='hard' && e.lv.includes('A')) ? 1.5 : 1;

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function pickN(pool, n, w){
  const p = pool.slice(), out = [];
  while(out.length<n && p.length){
    const ws = p.map(w), sum = ws.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum, i = 0;
    while(i<p.length-1 && r>=ws[i]){ r-=ws[i]; i++; }
    out.push(p.splice(i,1)[0]);
  }
  return out;
}

const restFor = (w,ratio) => Math.max(10, Math.round(w/ratio/5)*5);
const totalOf = (ws,ratio) => ws.reduce((t,w,i)=>t+w+(i<ws.length-1?restFor(w,ratio):0),0);

// Mix of long holds and shorter sets, tuned so work + rest lands on the chosen length
function planDurations(exs, level, len){
  const ratio = RATIO[level], target = len*60, opts = SHORT[level];
  const lo = opts[0], hi = opts[opts.length-1];
  const longIdx = shuffle(exs.map((e,i)=>e.long?i:-1).filter(i=>i>=0));
  let best = null;
  for(const n0 of LENGTHS[len].nl){
    const lset = longIdx.slice(0, Math.min(n0, longIdx.length));
    for(const L of LONGS[level]) for(const s of opts){
      const ws = exs.map((e,i)=>lset.includes(i)?L:s);
      const err = Math.abs(totalOf(ws,ratio)-target);
      if(!best || err<best.err || (err===best.err && Math.random()<.5)) best = {ws, err, lset};
    }
  }
  const ws = best.ws;
  const shortIdx = ws.map((w,i)=>best.lset.includes(i)?-1:i).filter(i=>i>=0);
  for(let k=0;k<120;k++){
    const t = totalOf(ws,ratio);
    if(Math.abs(t-target)<=5) break;
    const cands = t<target ? shortIdx.filter(i=>ws[i]<hi) : shortIdx.filter(i=>ws[i]>lo);
    if(!cands.length) break;
    ws[cands[Math.floor(Math.random()*cands.length)]] += t<target ? 5 : -5;
  }
  return ws;
}

function buildSession(level, len, hist){
  const recency = e => {
    const i = hist.findIndex(h=>h.ids.includes(e.id));
    return i<0 ? 1 : i===0 ? .1 : i===1 ? .4 : i===2 ? .65 : 1;
  };
  const poolFor = (cat, need) => {
    const core = EX.filter(e=>e.cat===cat && inLevel(e,level));
    if(core.length>=need) return {pool:core, borrowed:new Set()};
    const extra = EX.filter(e=>e.cat===cat && !core.includes(e) && nearLevel(e,level));
    return {pool:core.concat(extra), borrowed:new Set(extra)};
  };
  const weight = bor => e => recency(e) * (bor.has(e)?.4:1) * levelWeight(e,level);

  const {per, wild} = LENGTHS[len];
  const chosen = [];
  for(const cat of ['hip','ext','rot','lat']){
    const {pool,borrowed} = poolFor(cat,per);
    chosen.push(...pickN(pool,per,weight(borrowed)));
  }
  const fin = poolFor('fin',1);
  chosen.push(...pickN(fin.pool,1,weight(fin.borrowed)));
  if(wild){                                 // wildcard from any core category
    const rest = EX.filter(e=>e.cat!=='fin' && inLevel(e,level) && !chosen.includes(e));
    chosen.push(...pickN(rest,wild,weight(new Set())));
  }
  const exs = shuffle(chosen).sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat));
  const ws = planDurations(exs, level, len);
  const blocks = exs.map((ex,i)=>({ex, work:ws[i], rest:i<exs.length-1?restFor(ws[i],RATIO[level]):0}));
  return {kind:'core', level, len, blocks, total:totalOf(ws,RATIO[level])};
}

// Avoid recent exercises (soft) and, for core, any repeat of a recent exact set (hard)
function generate(kind, level, len){
  const hist = loadHistory().filter(h=>(h.kind||'core')===kind);
  if(kind!=='core') return buildRoutine(kind, hist);
  const sigs = hist.slice(0,7).map(h=>h.ids.slice().sort().join());
  let s;
  for(let i=0;i<40;i++){
    s = buildSession(level,len,hist);
    if(!sigs.includes(s.blocks.map(b=>b.ex.id).sort().join())) break;
  }
  return s;
}
/*LOGIC_END*/

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const fmt = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

// ---------- diagram rendering ----------
const dist = (u,v) => Math.hypot(u[0]-v[0],u[1]-v[1]);
const n1 = v => v.toFixed(1);
const seg = (u,v,w,c) => `<line class="${c}" x1="${n1(u[0])}" y1="${n1(u[1])}" x2="${n1(v[0])}" y2="${n1(v[1])}" stroke-width="${w}"/>`;
const arm = (s,a,c) => seg(s,a[0],9,c)+seg(a[0],a[1],8,c);
const leg = (p,l,c) => seg(p,l[0],11,c)+seg(l[0],l[1],9,c);
const MAT = '<rect class="mat" x="4" y="110" width="232" height="6" rx="3"/>';
const HOLD = '<g class="badge"><rect x="190" y="-4" width="44" height="17" rx="8.5"/><text x="212" y="8" text-anchor="middle">HOLD</text></g>';

// Which limbs move, and a motion arrow along the biggest movement, worked out once per exercise
function analyze(ex){
  const [A,B] = ex.pose;
  if(!B) return {mv:Object.fromEntries((ex.hl||[]).map(k=>[k,true])), arrow:'', hold:true};
  const mv = {};
  for(const k of ['a','a2','l','l2']) mv[k] = ex.hl ? ex.hl.includes(k) : (dist(A[k][0],B[k][0])>5 || dist(A[k][1],B[k][1])>5);
  const ctr = [(A.s[0]+A.p[0])/2, (A.s[1]+A.p[1])/2];
  if(ex.arrow){
    const {c, r} = ex.arrow;
    return {mv, hold:false, arrow:`<path class="arrow" marker-end="url(#ah)" d="M${c[0]+r},${c[1]} A${r},${r} 0 1 1 ${c[0]},${c[1]-r}"/>`};
  }
  const cands = [[A.a[1],B.a[1],1],[A.a2[1],B.a2[1],.8],[A.l[1],B.l[1],1],[A.l[0],B.l[0],.9],
                 [A.l2[1],B.l2[1],.8],[A.l2[0],B.l2[0],.7],[A.p,B.p,1.1],[A.h,B.h,.6]];
  if(A.m && B.m) cands.push([A.m,B.m,1.3]);
  let best=null, bd=0;
  for(const c of cands){ const d=dist(c[0],c[1])*c[2]; if(d>bd){ bd=d; best=c; } }
  if(!best || bd<5) return {mv, hold:false, arrow:''};
  const [P0,P1] = best, len = dist(P0,P1);
  let px = -(P1[1]-P0[1])/len, py = (P1[0]-P0[0])/len;
  const mid = [(P0[0]+P1[0])/2, (P0[1]+P1[1])/2];
  if((mid[0]-ctr[0])*px + (mid[1]-ctr[1])*py < 0){ px=-px; py=-py; }
  const off = 10, bulge = Math.min(16, len*.3);
  if(!A.z && (Math.max(P0[1],P1[1]) + py*off > 106 || mid[1] + py*(off+bulge) > 106)){ px=-px; py=-py; }
  const d = `M${n1(P0[0]+px*off)},${n1(P0[1]+py*off)} Q${n1(mid[0]+px*(off+bulge))},${n1(mid[1]+py*(off+bulge))} ${n1(P1[0]+px*off)},${n1(P1[1]+py*off)}`;
  return {mv, hold:false, arrow:`<path class="arrow" marker-start="url(#ah)" marker-end="url(#ah)" d="${d}"/>`};
}
ALL.forEach(ex => ex.meta = analyze(ex));

function props(p){
  let s = '';
  if(p.wall!=null) s += `<line class="prop" x1="${p.wall}" y1="-70" x2="${p.wall}" y2="110" stroke-width="5"/>`;
  if(p.chair){ const [x,y,w]=p.chair; s += `<line class="prop" x1="${x}" y1="${y}" x2="${x+w}" y2="${y}" stroke-width="6"/><line class="prop" x1="${x+3}" y1="${y}" x2="${x+3}" y2="110" stroke-width="4"/><line class="prop" x1="${x+w-3}" y1="${y}" x2="${x+w-3}" y2="110" stroke-width="4"/><line class="prop" x1="${x+3}" y1="${y}" x2="${x+3}" y2="${y-40}" stroke-width="4"/>`; }
  if(p.couch) s += '<rect class="propf" x="152" y="74" width="84" height="36" rx="6"/><rect class="propf" x="212" y="34" width="24" height="76" rx="6"/>';
  return s;
}
function figMarkup(p, m){
  const c = k => m.mv[k] ? (k.endsWith('2')?'mvf':'mv') : (k.endsWith('2')?'bk':'fg');
  let eye = '';
  if(p.f!=null){ const t=p.f*Math.PI/180; eye=`<circle class="eye" cx="${n1(p.h[0]+Math.cos(t)*5)}" cy="${n1(p.h[1]+Math.sin(t)*5)}" r="2.6"/>`; }
  const torso = p.m ? seg(p.s,p.m,15,'fg')+seg(p.m,p.p,15,'fg') : seg(p.s,p.p,15,'fg');
  const body = props(p) + m.arrow
    + arm(p.s,p.a2,c('a2')) + leg(p.p,p.l2,c('l2'))
    + seg(p.h,p.s,8,'fg') + torso
    + `<circle class="head" cx="${n1(p.h[0])}" cy="${n1(p.h[1])}" r="10"/>` + eye
    + leg(p.p,p.l,c('l')) + arm(p.s,p.a,c('a'));
  return MAT + (p.z ? `<g transform="translate(120 110) scale(${p.z}) translate(-120 -110)">${body}</g>` : body) + (m.hold ? HOLD : '');
}
function lerpPose(A,B,t){
  const m=(u,v)=>[u[0]+(v[0]-u[0])*t,u[1]+(v[1]-u[1])*t], m2=(x,y)=>[m(x[0],y[0]),m(x[1],y[1])];
  const f = A.f!=null && B.f!=null ? A.f+(B.f-A.f)*t : (t<.5?A.f:B.f);
  return {...A,h:m(A.h,B.h),s:m(A.s,B.s),p:m(A.p,B.p),f,m:A.m&&B.m?m(A.m,B.m):A.m,
          a:m2(A.a,B.a),a2:m2(A.a2,B.a2),l:m2(A.l,B.l),l2:m2(A.l2,B.l2)};
}
const Fig = {ex:null, time:0, last:0};
function setFig(ex){
  if(Fig.ex===ex) return;
  Fig.ex=ex; Fig.time=0;
  $('fig').innerHTML = figMarkup(ex.pose[0], ex.meta);
}
function figLoop(now){
  requestAnimationFrame(figLoop);
  const dt = Math.min(100, now-Fig.last); Fig.last = now;
  const ex = Fig.ex;
  if(!ex || !ex.pose[1] || $('run').hidden || R.paused) return;
  Fig.time += dt/1000;
  const c = (Fig.time/ex.period)%1;
  let t;
  if(reduceMotion) t = c<.5 ? 0 : 1;
  else { const x = .5-.5*Math.cos(2*Math.PI*c); t = x*x*(3-2*x); }
  $('fig').innerHTML = figMarkup(lerpPose(ex.pose[0],ex.pose[1],t), ex.meta);
}
requestAnimationFrame(figLoop);

  voice: store.get('runnerCore.voice')!=='0',
  rate: +store.get('runnerCore.rate') || 1,
};
function savePrefs(){
  store.set('runnerCore.sound',prefs.sound?'1':'0'); store.set('runnerCore.voice',prefs.voice?'1':'0'); store.set('runnerCore.rate',prefs.rate);
}
let actx = null;
function beep(freq, dur=.15, vol=.35, when=0){
  if(!prefs.sound || !actx) return;
  const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}

// Pick the most natural-sounding voice the browser offers for the page's language
let bestVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const lang = (navigator.language||'en-US').toLowerCase(), base = lang.split('-')[0];
  const score = v => {
    const l = (v.lang||'').toLowerCase().replace('_','-');
    let s = l===lang ? 4 : l.startsWith(base) ? 2 : -100;
    if(/natural|neural|premium|enhanced/i.test(v.name)) s+=6;
    if(/google/i.test(v.name)) s+=3;
    if(/samantha|ava|allison|evan|zoe|serena|daniel|karen|moira/i.test(v.name)) s+=2;
    if(/compact|novelty|whisper|bad news|bells|boing|bubbles|cellos|jester|organ|trinoids|zarvox/i.test(v.name)) s-=8;
    return s;
  };
  const ranked = speechSynthesis.getVoices().map(v=>[score(v),v]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  bestVoice = ranked.length ? ranked[0][1] : null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// Device text-to-speech, used only when a recorded clip is missing or can't play.
// The Android TV app provides AndroidTTS, since its WebView has no speechSynthesis.
function ttsSay(txt){
  if(window.AndroidTTS){
    try { AndroidTTS.speakAt ? AndroidTTS.speakAt(txt, prefs.rate) : AndroidTTS.speak(txt); } catch(e){}
    return;
  }
  if(!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    if(bestVoice){ u.voice = bestVoice; u.lang = bestVoice.lang; }
    u.rate = prefs.rate;
    speechSynthesis.speak(u);
  } catch(e){}
}

// Recorded coach voice: each spoken line is a list of [clip key, text] played back to back from audio/.
// A delay lets a beep finish before speech starts; a newer say() or hush() cancels anything pending.
const VOICE_TEXT = voiceLines();
const line = k => [k, VOICE_TEXT[k] || ''];
const clip = new Audio(); clip.preload = 'auto';
let sayToken = 0;
function say(items, delay=0){
  const token = ++sayToken;
  if(!prefs.voice || !items.length) return;
  const go = () => {
    let i = 0;
    const fallback = () => { if(token===sayToken) ttsSay(items.slice(Math.max(0,i-1)).map(x=>x[1]).join(' ')); };
    const next = () => {
      if(token!==sayToken || i>=items.length) return;
      const key = items[i++][0];
      clip.onended = () => { if(token===sayToken) setTimeout(next, 60); };
      clip.onerror = fallback;
      clip.src = `audio/${key}.mp3`;
      clip.defaultPlaybackRate = clip.playbackRate = prefs.rate;
      clip.preservesPitch = clip.webkitPreservesPitch = true;
      const pr = clip.play();
      if(pr) pr.catch(e => { if(e.name!=='AbortError') fallback(); });
    };
    if(token===sayToken) next();
  };
  delay ? setTimeout(go, delay) : go();
}
function hush(){
  sayToken++;
  try { clip.pause(); } catch(e){}
  try { window.AndroidTTS ? AndroidTTS.stop() : speechSynthesis.cancel(); } catch(e){}
}
// Warm the HTTP cache with this session's clips so playback starts instantly
function prefetchVoice(session){
  if(!prefs.voice || location.protocol==='file:') return;
  const keys = new Set(Object.keys(PHRASES));
  session.blocks.forEach(b=>{ keys.add('n-'+b.ex.id); keys.add('c-'+b.ex.id); keys.add(durLine(b)[0]); });
  keys.forEach(k=>fetch(`audio/${k}.mp3`).catch(()=>{}));
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
let wake = null;
async function lockScreen(){ try { if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
function unlockScreen(){ try { wake && wake.release(); } catch(e){} wake=null; }

function syncToggles(){
  $('tSound').setAttribute('aria-pressed',prefs.sound); $('tVoice').setAttribute('aria-pressed',prefs.voice);
}
$('tSound').onclick=()=>{ prefs.sound=!prefs.sound; savePrefs(); syncToggles(); };
$('tVoice').onclick=()=>{ prefs.voice=!prefs.voice; savePrefs(); if(!prefs.voice) hush(); syncToggles(); };

// ---------- workout runner ----------
const READY_SECS = 10;
const R = {active:false, paused:false, segs:[], i:0, el:0, last:0, lastSec:null, timer:0, session:null, total:0};

function buildSegs(session){
  const segs=[{type:'ready',dur:READY_SECS,show:0,cum:0}];
  let cum=0; const n=session.blocks.length;
  session.blocks.forEach((b,k)=>{
    segs.push({type:'work',dur:b.work,show:k,cum,switchAt:b.ex.uni?Math.round(b.work/2):null});
    cum+=b.work;
    if(k<n-1){ segs.push({type:'rest',dur:b.rest,show:k+1,cum}); cum+=b.rest; }
  });
  return segs;
}

function startWorkout(){
  const s=S.session;
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e){ actx=null; }
  saveHistory([{t:Date.now(), kind:s.kind, level:s.level, len:s.len, ids:s.blocks.map(b=>b.ex.id)}].concat(loadHistory()));
  prefetchVoice(s);
  Object.assign(R,{active:true,paused:false,session:s,segs:buildSegs(s),i:0,el:0,last:performance.now(),lastSec:null,total:s.total});
  $('home').hidden=true; $('setup').hidden=true; $('dock').hidden=true; $('done').hidden=true; $('run').hidden=false;
  $('prog').innerHTML=s.blocks.map(()=>'<i></i>').join('');
  document.body.dataset.paused='false'; $('bPause').textContent='Pause';
  syncToggles(); lockScreen(); onSegStart(); renderRun(); $('bPause').focus();
  clearInterval(R.timer); R.timer=setInterval(tick,100);
}

const durLine = b => line(b.ex.uni ? `d-${Math.round(b.work/2)}-each` : `d-${b.work}`);
function onSegStart(){
  const seg=R.segs[R.i], blocks=R.session.blocks, b=blocks[seg.show];
  R.lastSec=null; seg.switched=false; seg.half=false; seg.ten=false;
  // the first line plays straight from the Start tap, which is what lets phones allow audio
  if(seg.type==='ready'){ beep(660,.12); say([line('p-get-ready'), line('n-'+b.ex.id), durLine(b)]); }
  else if(seg.type==='work'){ beep(1175,.4,.4); buzz(200); say([line('c-'+b.ex.id)], 450); }
  else {
    beep(523,.15); beep(523,.15,.35,.2); buzz([80,60,80]);
    const intro = R.session.kind==='core' ? [line('p-rest')] : [];
    if(seg.show===blocks.length-1) intro.push(line('p-last'));
    say([...intro, line('n-'+b.ex.id), durLine(b)], 450);
  }
}

function tick(){
  if(!R.active) return;
  const now=performance.now(), dt=now-R.last; R.last=now;
  if(R.paused) return;
  R.el+=dt;
  while(R.active && R.el>=R.segs[R.i].dur*1000){
    R.el-=R.segs[R.i].dur*1000;
    if(R.i>=R.segs.length-1){ return finish(); }
    R.i++; onSegStart();
  }
  const seg=R.segs[R.i], left=Math.ceil((seg.dur*1000-R.el)/1000);
  if(left!==R.lastSec){
    R.lastSec=left;
    // spoken 3-2-1 when the voice is on, ticks otherwise, so the two never overlap
    // spoken 3-2-1 when the voice is on, ticks otherwise; short transitions only get ticks
    if(left>=1&&left<=3){ prefs.voice && seg.dur>=8 ? say([line('p-'+left)]) : beep(left===1?880:660,.09,.3); }
    else if(seg.type==='work' && left===10 && seg.dur>=30 && !seg.ten){ seg.ten=true; say([line('p-ten')]); }
  }
  if(R.session.kind==='core' && seg.type==='work' && seg.switchAt==null && seg.dur>=40 && !seg.half && R.el>=seg.dur*500){
    seg.half=true; say([line('p-halfway')]);
  }
  if(seg.switchAt!=null && !seg.switched && R.el>=seg.switchAt*1000){
    seg.switched=true; beep(988,.12); beep(988,.12,.35,.18); buzz([120,80,120]); say([line('p-switch')], 400);
    const sd=$('rSide'); sd.classList.remove('flash'); void sd.offsetWidth; sd.classList.add('flash');
  }
  renderRun();
}

function renderRun(){
  const seg=R.segs[R.i], blocks=R.session.blocks, n=blocks.length, b=blocks[seg.show], ex=b.ex;
  const leftMs=Math.max(0,seg.dur*1000-R.el), elapsed=seg.cum+(seg.type==='ready'?0:R.el/1000);
  document.body.dataset.phase=seg.type;
  const gapLabel = R.session.kind==='core' ? 'REST · NEXT UP' : 'NEXT UP · GET IN POSITION';
  const workLabel = R.session.kind==='cooldown' ? 'STRETCH' : R.session.kind==='warmup' ? 'MOVE' : 'WORK';
  $('phase').textContent = R.paused ? 'PAUSED' : seg.type==='ready'?'GET READY':seg.type==='work'?workLabel:gapLabel;
  $('setNo').textContent=`${seg.show+1} / ${n}`;
  $('totLeft').textContent=fmt(R.total-elapsed);
  $('totEl').textContent=`${fmt(elapsed)} elapsed`;
  $('rName').textContent=ex.name; $('rCue').textContent=ex.cue;
  setFig(ex);
  $('setTime').textContent=fmt(Math.ceil(leftMs/1000));
  $('tbarFill').style.width=(100*(1-leftMs/(seg.dur*1000)))+'%';
  const side=$('rSide'), how=howText(b);
  if(ex.uni && seg.type!=='work') side.textContent=`Each side: ${Math.round(b.work/2)}s · ${how}`;
  else if(ex.uni) side.textContent = seg.switched ? 'SIDE 2 OF 2 · switched' : `SIDE 1 OF 2 · switch at ${fmt(seg.dur-seg.switchAt)} left`;
  else side.textContent = how.charAt(0).toUpperCase()+how.slice(1);
  const nb=blocks[seg.show+1];
  $('rNext').innerHTML = seg.type==='work'
    ? (nb?`Next: <b>${nb.ex.name}</b> · ${b.rest}s ${KIND[R.session.kind].gap} first`:'<b>Last one</b>, finish strong')
    : seg.type==='rest' ? `${ex.uni?'Each side':'Work'} for <b>${ex.uni?Math.round(b.work/2):b.work}s</b>` : `${n} ${KIND[R.session.kind].unit} · ${fmt(R.total)} · starts in ${Math.ceil(leftMs/1000)}s`;
  document.querySelectorAll('#prog i').forEach((el,k)=>{
    el.className = k<seg.show ? 'done' : (k===seg.show && seg.type==='work' ? 'now' : '');
    if(k===seg.show && seg.type==='work') el.style.setProperty('--p',(100*(1-leftMs/(seg.dur*1000)))+'%');
  });
}

function setPaused(p){
  if(!R.active || R.paused===p) return;
  R.paused=p; R.last=performance.now();
  $('bPause').textContent=p?'Resume':'Pause'; document.body.dataset.paused=p;
  if(p){ hush(); unlockScreen(); } else lockScreen();
  renderRun();
}

function finish(){
  R.active=false; clearInterval(R.timer); unlockScreen();
  beep(784,.15); beep(988,.15,.35,.17); beep(1319,.35,.35,.34); buzz([200,100,200,100,400]);
  say([line('p-done-'+R.session.kind)], 700);
  const s=R.session;
  const K=KIND[s.kind];
  $('doneTxt').textContent = s.kind==='core'
    ? `${s.blocks.length} sets · ${fmt(s.total)} · ${LEVEL_LABEL[s.level]}. Logged, so tomorrow's session will steer away from these exercises.`
    : `${K.title} · ${s.blocks.length} ${K.unit} · ${fmt(s.total)}. Logged, so next time mixes in different options.`;
  $('run').hidden=true; $('done').hidden=false; document.body.dataset.phase='ready';
  $('again').focus();
}
function backToHome(){
  R.active=false; clearInterval(R.timer); unlockScreen(); hush(); Fig.ex=null;
  showHome();
}

$('start').onclick=startWorkout;
$('again').onclick=backToHome;
$('bStop').onclick=()=>{ if(confirm('End this session?')) backToHome(); };
$('bPause').onclick=()=>setPaused(!R.paused);
$('bSkip').onclick=()=>{
  if(!R.active) return;
  if(R.i>=R.segs.length-1) return finish();
  R.i++; R.el=0; onSegStart(); renderRun();
};
$('bBack').onclick=()=>{
  if(!R.active) return;
  if(R.el>3000 || R.i<=1) R.el=0; else { R.i--; R.el=0; }
  onSegStart(); renderRun();
};

// Leaving the page (Home on the TV, switching apps on the phone) pauses the workout
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') setPaused(true);
  else if(R.active && !R.paused) lockScreen();
});
window.onTvPause = () => setPaused(true);

// Keyboard and TV remote media keys
document.addEventListener('keydown',e=>{
  if(!R.active) return;
  if(e.code==='Space' || e.key==='MediaPlayPause' || e.key==='MediaPlay' || e.key==='MediaPause'){ e.preventDefault(); $('bPause').click(); }
  else if(e.key==='MediaTrackNext' || e.key==='MediaFastForward') $('bSkip').click();
  else if(e.key==='MediaTrackPrevious' || e.key==='MediaRewind') $('bBack').click();
});
// Called by the TV app's Back button; true means the page handled it
window.onTvBack = () => {
  if(R.active){ $('bStop').click(); return true; }
  if(!$('done').hidden || !$('setup').hidden){ backToHome(); return true; }
  return false;
};

showHome();
</script>
</body>
</html>
